<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none" stroke="currentColor">
  <circle cx="200" cy="200" r="190" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>
  <circle cx="200" cy="200" r="170" stroke-width="1.2" opacity="0.4"/>
  <circle cx="200" cy="200" r="140" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="110" stroke-width="1" stroke-dasharray="6 3" opacity="0.6"/>
  <circle cx="200" cy="200" r="80" stroke-width="1.2" opacity="0.7"/>
  <circle cx="200" cy="200" r="50" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="200" r="20" stroke-width="2" fill="currentColor" fill-opacity="0.1"/>
  
  <!-- 8 Petal Rotations -->
  <g opacity="0.65" stroke-width="1.2">
    <path d="M200,20 C230,90 230,150 200,200 C170,150 170,90 200,20 Z" />
    <path d="M200,20 C230,90 230,150 200,200 C170,150 170,90 200,20 Z" transform="rotate(45 200 200)" />
    <path d="M200,20 C230,90 230,150 200,200 C170,150 170,90 200,20 Z" transform="rotate(90 200 200)" />
    <path d="M200,20 C230,90 230,150 200,200 C170,150 170,90 200,20 Z" transform="rotate(135 200 200)" />
    <path d="M200,20 C230,90 230,150 200,200 C170,150 170,90 200,20 Z" transform="rotate(180 200 200)" />
    <path d="M200,20 C230,90 230,150 200,200 C170,150 170,90 200,20 Z" transform="rotate(225 200 200)" />
    <path d="M200,20 C230,90 230,150 200,200 C170,150 170,90 200,20 Z" transform="rotate(270 200 200)" />
    <path d="M200,20 C230,90 230,150 200,200 C170,150 170,90 200,20 Z" transform="rotate(315 200 200)" />
  </g>

  <!-- Outer Lotus Petals -->
  <g opacity="0.45" stroke-width="1">
    <path d="M200,50 Q260,110 280,180 Q210,180 200,200 Q190,180 120,180 Q140,110 200,50" transform="rotate(22.5 200 200)" />
    <path d="M200,50 Q260,110 280,180 Q210,180 200,200 Q190,180 120,180 Q140,110 200,50" transform="rotate(67.5 200 200)" />
    <path d="M200,50 Q260,110 280,180 Q210,180 200,200 Q190,180 120,180 Q140,110 200,50" transform="rotate(112.5 200 200)" />
    <path d="M200,50 Q260,110 280,180 Q210,180 200,200 Q190,180 120,180 Q140,110 200,50" transform="rotate(157.5 200 200)" />
    <path d="M200,50 Q260,110 280,180 Q210,180 200,200 Q190,180 120,180 Q140,110 200,50" transform="rotate(202.5 200 200)" />
    <path d="M200,50 Q260,110 280,180 Q210,180 200,200 Q190,180 120,180 Q140,110 200,50" transform="rotate(247.5 200 200)" />
    <path d="M200,50 Q260,110 280,180 Q210,180 200,200 Q190,180 120,180 Q140,110 200,50" transform="rotate(292.5 200 200)" />
    <path d="M200,50 Q260,110 280,180 Q210,180 200,200 Q190,180 120,180 Q140,110 200,50" transform="rotate(337.5 200 200)" />
  </g>
</svg>
